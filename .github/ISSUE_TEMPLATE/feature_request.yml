name: 功能建议 / Feature request
description: 提一个新想法或改进 / Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does it solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他办法 / Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: 涉及的部分 / Component
      options:
        - 记忆大脑 brain/
        - 星图 / 控制台 (web)
        - QQ 插件 plugin/dsh-aurabot-qq/
        - 扩展模块 ext-modules/
        - 文档 / Docs
        - 其他 / Other
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认 / Privacy check
      options:
        - label: 我确认上面没有真实账号、昵称、聊天内容或密钥 / I confirm there are no real IDs, nicknames, chat content or keys above
          required: true
