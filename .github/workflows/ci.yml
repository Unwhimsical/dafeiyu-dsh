name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brain:
    name: 记忆大脑 · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            brain/requirements.txt
            brain/requirements-dev.txt
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 运行测试
        run: python -m pytest -q

  plugin:
    name: QQ 插件 · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 插件 package.json 要求 node >= 22.13（node --test 的 glob 也需要 22+）
        node: ["22", "24"]
    defaults:
      run:
        working-directory: plugin/dsh-aurabot-qq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 运行测试
        run: npm test

  modules:
    name: 扩展模块语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --check
        run: |
          set -e
          for f in ext-modules/*/*.mjs ext-modules/*/*.js; do
            node --check "$f"
          done

  privacy:
    name: 脱敏扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scan_secrets.py
        run: python scripts/scan_secrets.py
